version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: log_db
    environment:
      POSTGRES_USER: log_user
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the environment}
      POSTGRES_DB: log_db
    ports:
      - "5433:5432"
    volumes:
      - log_pgdata:/var/lib/postgresql/data

volumes:
  log_pgdata: